name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a  # v2.4.0
        with:
          swift-version: "6.0"

      - name: Run Tests
        run: swift test

      - name: Build Examples
        run: swift build --package-path Examples
